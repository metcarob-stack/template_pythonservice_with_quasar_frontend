name: build_test_and_deploy

on:
  push:
    tags:
      - '*'

jobs:
  build_test_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # === prepare stage ===
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Load repo vars
        run: |
          source ./_repo_vars.sh
          echo "PROJECT_NAME=$PROJECT_NAME" >> $GITHUB_ENV
          echo "RJM_VERSION=$RJM_VERSION" >> $GITHUB_ENV
          echo "RJM_MAJOR_VERSION=$RJM_MAJOR_VERSION" >> $GITHUB_ENV
          echo "TARGET_SERVER=$TARGET_SERVER" >> $GITHUB_ENV          

      # === build stage ===
      - name: Read Docker credentials from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ secrets.VAULT_ADDR }}
          method: approle
          roleId: ${{ secrets.VAULT_ROLE_ID }}
          secretId: ${{ secrets.VAULT_SECRET_ID }}
          exportEnv: true
          secrets: |
            kv/data/robert_accounts/gchr/personal_access_tokens/metcarob_stack_deployment password | GCHR_PAT ;
            kv/data/asfplatform/webapps/${{ env.PROJECT_NAME }}/ssh private_key | SSH_KEY ;
            kv/data/asfplatform/webapps/${{ env.PROJECT_NAME }}/ssh ssh_port | SSH_PORT ;
            kv/data/asfplatform/webapps/${{ env.PROJECT_NAME }}/ssh ssh_host | SSH_HOST ;
            kv/data/asfplatform/webapps/${{ env.PROJECT_NAME }}/ssh ssh_user | SSH_USER

      - name: Unit tests
        run: |
          source ./_repo_vars.sh && \
          echo "Running uint tests for ${PROJECT_NAME}" && \
          docker run --rm -v "$PWD/services:/opt/services" -w /opt/services \
            ${RJM_PYTHON_TEST_IMAGE} \
            sh -c "pip3 install --no-cache-dir -r ./src/requirements.txt && \
                   pip3 install --no-cache-dir -r ./testContainer/requirements.txt && \
                   SKIPSQLALCHEMYTESTS=Y python3 -m pytest ./test"

      - name: Build frontend
        run: |
          source ./_repo_vars.sh && \
          docker run --rm -v "$PWD:/opt/work" -w /opt/work \
            ${QUASARBUILDIMAGE} \
            -c "build_quasar_app ./frontend ${QUASARBUILDMODE} ${RJM_VERSION}"

      - name: Build main image
        run: |
          source ./_repo_vars.sh && \
          docker build --build-arg PROJECT_NAME="${PROJECT_NAME}" --build-arg QUASARBUILDMODE="${QUASARBUILDMODE}" -t ghcr.io/${{ github.repository_owner }}/${PROJECT_NAME}:${RJM_VERSION} .

      - name: Build test image
        run: |
          source ./_repo_vars.sh && \
          docker build \
            -t ${DOCKER_USERNAME}/${PROJECT_NAME}test:develop \
            -f services/testContainer/Dockerfile services/testContainer

      - name: Container level tests
        run: |
          source ./_repo_vars.sh && \
          docker compose -f .github/compose-test.yml up --abort-on-container-exit --exit-code-from main_apptest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GitHub Container Registry
        run: |
          source ./_repo_vars.sh
          docker push ghcr.io/${{ github.repository_owner }}/${PROJECT_NAME}:${RJM_VERSION}

      - name: Deploy to Docker Swarm
        run: |
          source ./_repo_vars.sh
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          python3 - <<'PY' | ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST"

          import json
          import os

          project_name = os.environ["PROJECT_NAME"]
          rjm_major_version = os.environ["RJM_MAJOR_VERSION"]

          request = {
              "operation": "deploy",
              "version": os.environ["RJM_VERSION"],
              "project_name": project_name,
              "target_server": os.environ["TARGET_SERVER"],
              "docker_username": os.environ["DOCKER_USERNAME"],
              "gchr_pat": os.environ["GCHR_PAT"],
              "extra_environment": {
                  "APIAPP_DEFAULTHOMEADMINUSERNAME": "admin",
                  "APIAPP_APIURL": "https://api2.metcarob.com/api",
                  "APIAPP_APIDOCSURL": (
                      f"https://api2.metcarob.com/"
                      f"{project_name}/"
                      f"v{rjm_major_version}/public/web/apidocs"
                  ),
                  "APIAPP_FRONTENDURL": (
                      f"https://api2.metcarob.com/"
                      f"{project_name}/"
                      f"v{rjm_major_version}/public/web/frontend"
                  ),
                  "APIAPP_DEFAULTMASTERTENANTJWTCOLLECTIONALLOWEDORIGINFIELD": (
                      "https://api2.metcarob.com,"
                      "https://localhost,"
                      "http://localhost"
                  ),
                  "APIAPP_JWTSECRETVAULT": "/asfplatform/webapps/_common:APIAPP_JWTSECRET"
              }
          }

          print(json.dumps(request))
          PY

      - name: Test the newly deployed container using test endpoint
        run: |
          source ./_repo_vars.sh && \
          sleep 5 && \
          docker run --rm \
            -e HTTPORIGIN_TO_TEST=https://api2.metcarob.com \
            -e APIAPP_DEFAULTHOMEADMINUSERNAME=codefresh_test_user \
            -e APIAPP_DEFAULTHOMEADMINPASSWORD=${SAASCODEFRESHTESTUSERPASSWORD} \
            -e TESTPARAM_ENDPOINTURL=https://api2.metcarob.com/${PROJECT_NAME}/test/v${RJM_MAJOR_VERSION} \
            -e TESTPARAM_THROUGHKONG="TRUE" \
            -e TESTPARAM_EXPECTED_CONTAINER_VERSION="${RJM_VERSION}" \
            ${DOCKER_USERNAME}/${PROJECT_NAME}test:develop \
            python3 -m pytest /test

      - name: Switch to prod and clean up old services
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          python3 - <<'PY' | ssh \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i ~/.ssh/deploy_key \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST"

          import json
          import os

          project_name = os.environ["PROJECT_NAME"]
          rjm_major_version = os.environ["RJM_MAJOR_VERSION"]

          request = {
              "operation": "deployprod",
              "version": os.environ["RJM_VERSION"],
              "project_name": project_name
          }

          print(json.dumps(request))
          PY
